ktor.deployment {
    host = "127.0.0.1"
    host = ${?HOST}
    port = 8080
    port = ${?PORT}
}

database {
    url = "jdbc:postgresql://127.0.0.1:5432/coffee_journal"
    url = ${?DATABASE_URL}
    user = "coffee_journal"
    user = ${?DB_USER}
    password = "local-coffee-journal"
    password = ${?DB_PASSWORD}
    poolSize = 4
    poolSize = ${?DB_POOL_SIZE}
    parallelism = 4
    parallelism = ${?DB_PARALLELISM}
}

journal {
    ownerId = "00000000-0000-0000-0000-000000000001"
    ownerId = ${?OWNER_ID}
}
