services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: coffee_journal
      POSTGRES_USER: coffee_journal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-coffee-journal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_journal -d coffee_journal"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
