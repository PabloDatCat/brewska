name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's Linux runner provides Docker; integrationTest starts real PostgreSQL.
      - name: Verify all tests and runnable distribution
        run: ./gradlew --no-daemon check installDist
